<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin-top: 50px;
        }

        .container{
            background: white;
            width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            color: #2c3e50;
        }

        input[type="text"]{
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #2980b9;
        }

        .response{
            margin-top: 20px;
            font-size: 18px;
            color: green;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>AI Chatbot</h1>

    <form method="POST">

        <input
            type="text"
            name="message"
            placeholder="Ask something">

        <button type="submit">
            Send
        </button>

    </form>

    <div class="response">
        {{ response }}
    </div>

</div>

</body>
</html>
